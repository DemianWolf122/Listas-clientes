<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atrio · Leads Electrónica</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<style>
  :root{
    --bg:#0e1320; --bg2:#0b0f1a; --card:#171f2f; --card2:#1e2841; --line:#2a374d;
    --txt:#e9eefb; --muted:#93a2bd; --muted2:#6c7a94; --accent:#5b8cff; --gold:#e5b567;
    --take:#3ecf8e; --wait:#e5b567; --skip:#6b7688; --manual:#b98bff; --wa:#25d366; --verif:#3ecf8e;
    --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
  body{padding-bottom:60px}
  a{color:inherit}
  header{position:sticky;top:0;z-index:20;background:rgba(11,15,26,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px}
  .hwrap{max-width:1280px;margin:0 auto}
  .htop{display:flex;justify-content:space-between;align-items:center;gap:10px}
  h1{margin:0;font-size:18px;letter-spacing:.2px} h1 span{color:var(--gold)}
  .sub{color:var(--muted2);font-size:12px}
  .btn-search{background:var(--accent);border:none;color:#fff;border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:650;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .btn-search.on{background:var(--card);color:var(--muted);border:1px solid var(--line)}
  .stats{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 2px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
  .stat b{color:var(--txt);font-size:15px} .stat.take b{color:var(--take)} .stat.verif b{color:var(--verif)}
  .panel{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .panel.open{max-height:900px;margin-top:11px}
  input,select,textarea{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;width:100%;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .prow .search{flex:1;min-width:180px}
  .prow select{width:auto;min-width:150px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .qchip{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;user-select:none;transition:.12s}
  .qchip:hover{border-color:var(--accent)} .qchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:9px}
  main{max-width:1280px;margin:0 auto;padding:14px 16px}
  .count{color:var(--muted2);font-size:12.5px;margin:2px 2px 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);transition:.15s;display:flex;flex-direction:column;gap:9px;cursor:pointer}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card.done{opacity:.58}
  .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .name{font-size:16px;font-weight:650;margin:0;line-height:1.2}
  .badges{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .v-TAKE{background:rgba(62,207,142,.16);color:var(--take)} .v-WAIT{background:rgba(229,181,103,.16);color:var(--wait)}
  .v-SKIP{background:rgba(107,118,136,.2);color:#95a2b8} .v-MANUAL_REVIEW{background:rgba(185,139,255,.16);color:var(--manual)}
  .verif{background:rgba(62,207,142,.13);color:var(--verif)}
  .tanda{font-size:11px;color:var(--gold);background:rgba(229,181,103,.08);border:1px solid rgba(229,181,103,.3);border-radius:6px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
  .meta{color:var(--muted);font-size:12px}
  .scores{display:flex;gap:12px;font-size:11.5px;color:var(--muted2);flex-wrap:wrap;align-items:center}
  .scores b{color:var(--txt);font-size:14px}
  .prodtag{margin-left:auto;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--gold)}
  .desc{color:#c6d2ea;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .who{font-size:12px;color:var(--muted)} .who b{color:var(--txt)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:5px;text-decoration:none;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:.12s}
  .btn:hover{border-color:var(--accent)} .btn.wa{background:var(--wa);color:#04240f;border-color:transparent} .btn:active{transform:scale(.96)}
  .btn.ghost{background:none;color:var(--muted)}
  .cfoot{display:flex;align-items:center;gap:8px;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
  .chk input{width:18px;height:18px;accent-color:var(--take);cursor:pointer}
  .openhint{font-size:12px;color:var(--accent);font-weight:600}
  .saved{color:var(--take);font-size:11px}
  .empty{text-align:center;color:var(--muted);padding:50px 0}
  /* MODAL / ficha flotante */
  .modal{position:fixed;inset:0;background:rgba(4,7,14,.7);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:26px 16px;overflow-y:auto}
  .modal.open{display:flex}
  .mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:700px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:scale(1);opacity:1}}
  .mclose{position:absolute;top:14px;right:14px;background:var(--card2);border:1px solid var(--line);color:var(--muted);width:34px;height:34px;border-radius:9px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mclose:hover{color:var(--txt);border-color:var(--accent)}
  .mname{font-size:22px;font-weight:700;margin:0 40px 8px 0;line-height:1.15}
  .mbadges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .msec{border-top:1px solid var(--line);margin-top:15px;padding-top:14px}
  .mlbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted2);font-weight:700;margin-bottom:9px}
  .btns2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
  .btns2 .btn{justify-content:center;padding:12px 12px;font-size:13px}
  .mrow{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin-bottom:4px}
  .mrow b{color:var(--txt)}
  .mscores{display:flex;gap:18px;margin:10px 0;font-size:13px;color:var(--muted2)} .mscores b{color:var(--txt);font-size:18px;display:block}
  .reason{background:var(--card2);border-left:3px solid var(--line);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;color:#c6d2ea}
  .msgblock{margin-bottom:12px}
  .msghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px}
  .msgacts{display:flex;gap:6px;align-items:center;flex-shrink:0}
  .msghead .mlbl{margin:0}
  .msgbox{background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:11px 13px;font-size:13px;color:#bccdec;white-space:pre-wrap;line-height:1.5}
  .fuentes{font-size:12px;color:var(--muted2);margin-top:10px}
  .mnotas textarea{min-height:70px;resize:vertical;margin-top:2px}
  @media(max-width:520px){ .grid{grid-template-columns:1fr} h1{font-size:16px} .prow select{width:100%} .mbox{padding:18px} .mname{font-size:19px} }
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--take);color:#04240f;font-weight:700;font-size:13px;padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:200;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="htop">
    <div><h1>⚡ Atrio · <span>Leads</span></h1><div class="sub">CABA + Mar del Plata · en vivo</div></div>
    <button class="btn-search" id="togglesearch">🔍 Buscar y filtrar</button>
  </div>
  <div class="panel" id="panel">
    <div class="stats" id="stats"></div>
    <div class="prow">
      <div class="search"><input id="q" placeholder="🔎 Nombre, zona, dirección, rubro…" /></div>
      <select id="sort" title="Ordenar">
        <option value="recent">Más recientes</option>
        <option value="verif">Verificados primero</option>
        <option value="final">Mayor score</option>
        <option value="verdict">Por veredicto</option>
        <option value="name">Nombre A-Z</option>
      </select>
    </div>
    <div class="chips" id="qchips">
      <span class="qchip on" data-q="all">Todos</span>
      <span class="qchip" data-q="take">✅ TAKE</span>
      <span class="qchip" data-q="wa">💬 Con WhatsApp</span>
      <span class="qchip" data-q="verif">✓ Verificados</span>
      <span class="qchip" data-q="nocont">Sin contactar</span>
      <span class="qchip" data-q="mdp">Mar del Plata</span>
      <span class="qchip" data-q="caba">CABA</span>
    </div>
    <div class="filters">
      <select id="f-zona"><option value="">Zona / barrio</option></select>
      <select id="f-sub"><option value="">Sub-rubro</option></select>
      <select id="f-web"><option value="">Estado web</option></select>
      <select id="f-verdict"><option value="">Veredicto</option></select>
      <select id="f-prod"><option value="">Producto</option></select>
      <select id="f-tanda"><option value="">Tanda</option></select>
    </div>
  </div>
</div></header>

<main>
  <div class="count" id="count">Cargando…</div>
  <div class="grid" id="list"></div>
</main>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://wjxekfxyxrfvmsfbqvsj.supabase.co";
const SUPABASE_KEY="sb_publishable_4Asc-X1Wrs2FI1QAvi7FuA_SuSXbCMJ";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const el=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ALL=[], activeQuicks=new Set();
const MSG_TRABAJOS="Acá pueden ver algunos de nuestros trabajos: atriostudio.com.ar";
const MSG_SALUDO="Muchas gracias por su tiempo. Quedamos a disposición por cualquier consulta. Saludos cordiales, Demian — Atrio Studio.";

async function load(){
  const {data,error}=await sb.from('atrio_leads_electro').select('*');
  if(error){el('count').textContent='Error: '+error.message;return;}
  ALL=data||[]; buildFilters(); renderStats(); render();
}
const isVerif=l=>Array.isArray(l.senales)&&l.senales.includes('verificado_web');
const uniq=k=>[...new Set(ALL.map(l=>l[k]).filter(Boolean))].sort();
function fillSel(id,vals){const s=el(id);vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});}
function buildFilters(){fillSel('f-zona',uniq('zona_barrio'));fillSel('f-sub',uniq('sub_rubro'));fillSel('f-web',uniq('website_status'));fillSel('f-verdict',uniq('verdict'));fillSel('f-prod',uniq('producto_sugerido'));fillSel('f-tanda',uniq('tanda'));}
function renderStats(){
  const c=v=>ALL.filter(l=>l.verdict===v).length;
  el('stats').innerHTML=
    `<span class="stat">Total <b>${ALL.length}</b></span>`+
    `<span class="stat take">TAKE <b>${c('TAKE')}</b></span>`+
    `<span class="stat verif">✓ Verif <b>${ALL.filter(isVerif).length}</b></span>`+
    `<span class="stat">WAIT <b>${c('WAIT')}</b></span>`+
    `<span class="stat">Review <b>${c('MANUAL_REVIEW')}</b></span>`+
    `<span class="stat">Contactados <b>${ALL.filter(l=>l.contactado).length}</b></span>`;
}
function matches(l){
  const q=el('q').value.trim().toLowerCase();
  if(q){const hay=[l.name,l.zona_barrio,l.address,l.descripcion,l.sub_rubro,l.city].join(' ').toLowerCase();if(!hay.includes(q))return false;}
  const F=(id,k)=>{const v=el(id).value;return !v||l[k]===v;};
  if(!F('f-zona','zona_barrio')||!F('f-sub','sub_rubro')||!F('f-web','website_status')||!F('f-verdict','verdict')||!F('f-prod','producto_sugerido')||!F('f-tanda','tanda'))return false;
  if(activeQuicks.has('take')&&l.verdict!=='TAKE')return false;
  if(activeQuicks.has('wa')&&!l.whatsapp)return false;
  if(activeQuicks.has('verif')&&!isVerif(l))return false;
  if(activeQuicks.has('nocont')&&l.contactado)return false;
  if(activeQuicks.has('mdp')&&!(l.city||'').toLowerCase().includes('mar del plata'))return false;
  if(activeQuicks.has('caba')&&l.province!=='CABA')return false;
  return true;
}
const VORDER={TAKE:0,WAIT:1,MANUAL_REVIEW:2,SKIP:3};
function sortLeads(rows){
  const s=el('sort').value;
  return rows.sort((a,b)=>{
    if(s==='recent')return (''+(b.created_at||'')).localeCompare(''+(a.created_at||''));
    if(s==='name')return (a.name||'').localeCompare(b.name||'');
    if(s==='verdict')return (VORDER[a.verdict]-VORDER[b.verdict])||(b.final_score-a.final_score);
    if(s==='verif'){const d=(isVerif(b)-isVerif(a));if(d)return d;const t=(VORDER[a.verdict]-VORDER[b.verdict]);if(t)return t;return b.final_score-a.final_score;}
    return (b.final_score||0)-(a.final_score||0);
  });
}
function waHref(l){const m=l.mensaje_whatsapp?('?text='+encodeURIComponent(l.mensaje_whatsapp)):'';return `https://wa.me/${esc(l.whatsapp)}${m}`;}
function mailHref(l){
  const subj=l.email_asunto||'Atrio Studio — catálogo con stock en vivo';
  const body=l.email_cuerpo||l.mensaje_whatsapp||'';
  return `mailto:${esc(l.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
}
function vcardHref(l){
  const tel=l.whatsapp?('+'+l.whatsapp):(l.phone||'');
  let v='BEGIN:VCARD\nVERSION:3.0\nFN:'+(l.name||'Lead')+'\nORG:'+(l.name||'')+'\n';
  if(tel)v+='TEL;TYPE=CELL:'+tel+'\n';
  if(l.phone&&l.phone!==tel)v+='TEL;TYPE=WORK:'+l.phone+'\n';
  v+='END:VCARD';
  return 'data:text/vcard;charset=utf-8,'+encodeURIComponent(v);
}
const vcardName=l=>(l.name||'contacto').replace(/[^\w\-]+/g,'_').slice(0,40);
function sendBtn(txt,l){return l.whatsapp?`<a class="btn wa" style="padding:6px 10px;font-size:11.5px" target="_blank" href="https://wa.me/${esc(l.whatsapp)}?text=${encodeURIComponent(txt)}">💬 Enviar</a>`:'';}
function msgBlock(lbl,txt,key,l,waSend){
  const idAttr=(key==='wa'||key==='mail')?` data-id="${l.id}"`:'';
  return `<div class="msgblock"><div class="msghead"><span class="mlbl">${lbl}</span><span class="msgacts">${waSend?sendBtn(txt,l):''}<button class="btn ghost" data-copy="${key}"${idAttr}>📋 Copiar</button></span></div><div class="msgbox">${esc(txt)}</div></div>`;
}
function contactBtns(l){
  let b='';
  if(l.whatsapp)b+=`<a class="btn wa" target="_blank" href="${waHref(l)}">💬 WhatsApp</a>`;
  if(l.phone)b+=`<a class="btn" href="tel:${esc(l.phone)}">📞 Llamar</a>`;
  if(l.email)b+=`<a class="btn" href="${mailHref(l)}">✉️ Mail</a>`;
  if(l.instagram)b+=`<a class="btn" target="_blank" href="${esc(l.instagram)}">📸 Instagram</a>`;
  if(l.facebook)b+=`<a class="btn" target="_blank" href="${esc(l.facebook)}">📘 Facebook</a>`;
  if(l.website)b+=`<a class="btn" target="_blank" href="${esc(l.website)}">🌐 Web</a>`;
  b+=`<a class="btn" target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent([l.name,l.address,l.city].filter(Boolean).join(' '))}">📍 Maps</a>`;
  if(l.whatsapp||l.phone)b+=`<a class="btn" href="${vcardHref(l)}" download="${vcardName(l)}.vcf">💾 Guardar contacto</a>`;
  return b;
}
function emailText(l){const s=l.email_asunto||'',b=l.email_cuerpo||'';if(!s&&!b)return '';return (s?('Asunto: '+s+'\n\n'):'')+b;}
const badges=l=>`<span class="badge v-${esc(l.verdict)}">${esc(l.verdict)}${l.verdict_confidence!=null?` · ${Math.round(l.verdict_confidence*100)}%`:''}</span>${isVerif(l)?`<span class="badge verif">✓ verif</span>`:''}`;

function card(l){
  return `<div class="card ${l.contactado?'done':''}" data-id="${l.id}" data-open="1">
    <div class="ctop"><p class="name">${esc(l.name)}</p><div class="badges">${badges(l)}</div></div>
    ${l.tanda?`<div class="tanda">🏷️ ${esc(l.tanda)}</div>`:''}
    <div class="meta">${esc(l.sub_rubro||'')}${l.tier?` · T${l.tier}`:''} · ${esc(l.zona_barrio||l.city||'')}${l.address?` · ${esc(l.address)}`:''}</div>
    <div class="scores"><span>fit <b>${l.fit_score??'—'}</b></span><span>mom <b>${l.momentum_score??'—'}</b></span><span>final <b>${l.final_score??'—'}</b></span>${l.producto_sugerido?`<span class="prodtag">${esc(l.producto_sugerido)}</span>`:''}</div>
    ${l.descripcion?`<div class="desc">${esc(l.descripcion)}</div>`:''}
    <div class="btns">${contactBtns(l)}</div>
    <div class="cfoot">
      <label class="chk"><input type="checkbox" data-cont="${l.id}" ${l.contactado?'checked':''}/> Contactado</label>
      <span class="openhint">Ver ficha →</span>
    </div>
  </div>`;
}
function render(){
  const rows=sortLeads(ALL.filter(matches));
  el('count').textContent=`${rows.length} lead${rows.length!==1?'s':''}`;
  el('list').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">Sin resultados con estos filtros.</div>';
}

// ---- MODAL ----
function modalContent(l){
  const em=emailText(l);
  let msgs='';
  if(l.mensaje_whatsapp)msgs+=msgBlock('WhatsApp',l.mensaje_whatsapp,'wa',l,true);
  if(em)msgs+=msgBlock('Mail',em,'mail',l,false);
  msgs+=msgBlock('Nuestros trabajos',MSG_TRABAJOS,'trabajos',l,true);
  msgs+=msgBlock('Saludo cordial',MSG_SALUDO,'saludo',l,true);
  return `<button class="mclose" id="mclose">✕</button>
    <h2 class="mname">${esc(l.name)}</h2>
    <div class="mbadges">${badges(l)}${l.tanda?`<span class="tanda">🏷️ ${esc(l.tanda)}</span>`:''}</div>
    <div class="mrow">
      ${l.sub_rubro?`<span>${esc(l.sub_rubro)}${l.tier?` · T${l.tier}`:''}</span>`:''}
      ${l.zona_barrio||l.city?`<span>📍 ${esc(l.zona_barrio||'')}${l.city?` · ${esc(l.city)}`:''}</span>`:''}
      ${l.address?`<span><b>${esc(l.address)}</b></span>`:''}
      ${l.producto_sugerido?`<span>Producto: <b>${esc(l.producto_sugerido)}</b></span>`:''}
    </div>
    <div class="mscores"><span>fit<b>${l.fit_score??'—'}</b></span><span>momentum<b>${l.momentum_score??'—'}</b></span><span>final<b>${l.final_score??'—'}</b></span></div>
    ${l.descripcion?`<div style="color:#c6d2ea;font-size:14px">${esc(l.descripcion)}</div>`:''}
    ${l.manejado_por?`<div class="who" style="margin-top:8px">👤 <b>${esc(l.manejado_por)}</b></div>`:''}
    <div class="msec"><div class="mlbl">Contacto</div><div class="btns2">${contactBtns(l)}</div></div>
    <div class="msec"><div class="mlbl">Mensajes sugeridos</div>${msgs}</div>
    <div class="msec"><div class="mlbl">Análisis</div>
      ${l.verdict_reason?`<div class="reason">${esc(l.verdict_reason)}</div>`:'<div class="reason">—</div>'}
      ${(Array.isArray(l.fuentes)&&l.fuentes.length)?`<div class="fuentes">Fuentes: ${l.fuentes.map(esc).join(' · ')} · confianza ${esc(l.confianza_global||'—')}</div>`:''}
    </div>
    <div class="msec"><div class="mlbl">Gestión</div>
      <label class="chk" style="margin-bottom:10px"><input type="checkbox" data-cont="${l.id}" ${l.contactado?'checked':''}/> Contactado</label>
      <div class="mnotas"><textarea placeholder="Escribí una nota…" data-notas="${l.id}">${esc(l.notas||'')}</textarea><span class="saved" id="sv-${l.id}"></span></div>
    </div>`;
}
function openModal(id){const l=ALL.find(x=>x.id===id);if(!l)return;el('mbox').innerHTML=modalContent(l);el('modal').classList.add('open');document.body.style.overflow='hidden';}
function closeModal(){el('modal').classList.remove('open');document.body.style.overflow='';}

function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
async function setContact(id,val){
  const {error}=await sb.from('atrio_leads_electro').update({contactado:val,contactado_at:val?new Date().toISOString():null}).eq('id',id);
  const l=ALL.find(x=>x.id===id);if(l&&!error)l.contactado=val;
  document.querySelectorAll(`[data-cont="${id}"]`).forEach(cb=>cb.checked=val);
  document.querySelector(`.card[data-id="${id}"]`)?.classList.toggle('done',val);
  renderStats();toast(val?'Marcado como contactado ✓':'Desmarcado');
  if(error)toast('No se pudo guardar');
}
let nt;async function setNotas(id,val){
  const {error}=await sb.from('atrio_leads_electro').update({notas:val}).eq('id',id);
  const l=ALL.find(x=>x.id===id);if(l&&!error)l.notas=val;
  const sv=el('sv-'+id);if(sv){sv.textContent=error?'✗':'guardado ✓';setTimeout(()=>sv.textContent='',1400);}
}
document.addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){const k=cp.dataset.copy;let txt;
    if(k==='trabajos')txt=MSG_TRABAJOS;
    else if(k==='saludo')txt=MSG_SALUDO;
    else{const l=ALL.find(x=>x.id===cp.dataset.id);txt=k==='wa'?l.mensaje_whatsapp:emailText(l);}
    navigator.clipboard.writeText(txt).then(()=>toast('Copiado ✓')).catch(()=>toast('No se pudo copiar'));return;}
  if(e.target.closest('#mclose')||e.target.id==='modal'){closeModal();return;}
  const card=e.target.closest('[data-open]');
  if(card && !e.target.closest('a,button,input,textarea,label')){openModal(card.dataset.id);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.addEventListener('change',e=>{const c=e.target.closest('[data-cont]');if(c)setContact(c.dataset.cont,c.checked);});
document.addEventListener('input',e=>{const n=e.target.closest('[data-notas]');if(n){clearTimeout(nt);nt=setTimeout(()=>setNotas(n.dataset.notas,n.value),700);}});
['q','f-zona','f-sub','f-web','f-verdict','f-prod','f-tanda','sort'].forEach(id=>el(id).addEventListener('input',render));
el('togglesearch').addEventListener('click',()=>{const p=el('panel');const open=p.classList.toggle('open');el('togglesearch').classList.toggle('on',open);el('togglesearch').textContent=open?'✕ Cerrar búsqueda':'🔍 Buscar y filtrar';});
el('qchips').addEventListener('click',e=>{
  const c=e.target.closest('.qchip');if(!c)return;
  const q=c.dataset.q;
  if(q==='all'){activeQuicks.clear();}
  else{activeQuicks.has(q)?activeQuicks.delete(q):activeQuicks.add(q);}
  document.querySelectorAll('.qchip').forEach(x=>x.classList.toggle('on', x.dataset.q==='all'?activeQuicks.size===0:activeQuicks.has(x.dataset.q)));
  render();
});
load();
</script>
</body>
</html>
